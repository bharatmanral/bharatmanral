<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title">
  <title id="title">bharatmanral</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050510"/>
      <stop offset="45%" stop-color="#0b1226"/>
      <stop offset="100%" stop-color="#1a0a2e"/>
    </linearGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4"/>
      <stop offset="50%" stop-color="#7b2ff7"/>
      <stop offset="100%" stop-color="#ff6bcb"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#a5b4fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f5d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6bcb" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff6bcb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7b2ff7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7b2ff7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#bg)"/>

  <!-- soft orbs -->
  <circle cx="180" cy="90" r="160" fill="url(#orb1)" opacity="0.55">
    <animate attributeName="cx" values="180;220;180" dur="8s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="320" r="200" fill="url(#orb2)" opacity="0.45">
    <animate attributeName="cy" values="320;280;320" dur="9s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="60" r="140" fill="url(#orb3)" opacity="0.5">
    <animate attributeName="r" values="140;170;140" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- grid -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <path d="M0 70 H1200 M0 140 H1200 M0 210 H1200 M0 280 H1200 M0 350 H1200"/>
    <path d="M150 0 V420 M300 0 V420 M450 0 V420 M600 0 V420 M750 0 V420 M900 0 V420 M1050 0 V420"/>
  </g>

  <!-- accent slash -->
  <path d="M80 340 L280 60" stroke="url(#neon)" stroke-width="4" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <path d="M920 380 L1120 90" stroke="url(#neon)" stroke-width="3" stroke-linecap="round" opacity="0.55"/>

  <!-- floating chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#e2e8f0">
    <rect x="860" y="70" rx="12" width="92" height="36" fill="#ffffff" fill-opacity="0.06" stroke="#00f5d4" stroke-opacity="0.5"/>
    <text x="906" y="93" text-anchor="middle">Go</text>
    <rect x="970" y="120" rx="12" width="110" height="36" fill="#ffffff" fill-opacity="0.06" stroke="#ff6bcb" stroke-opacity="0.5"/>
    <text x="1025" y="143" text-anchor="middle">Rust</text>
    <rect x="820" y="160" rx="12" width="130" height="36" fill="#ffffff" fill-opacity="0.06" stroke="#a78bfa" stroke-opacity="0.55"/>
    <text x="885" y="183" text-anchor="middle">Haskell</text>
    <rect x="940" y="210" rx="12" width="92" height="36" fill="#ffffff" fill-opacity="0.06" stroke="#38bdf8" stroke-opacity="0.5"/>
    <text x="986" y="233" text-anchor="middle">Nix</text>
  </g>

  <!-- name -->
  <text x="90" y="195" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="800" fill="url(#textGrad)" letter-spacing="-2">BHARAT</text>
  <text x="90" y="275" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-2">MANRAL</text>

  <!-- underline neon -->
  <rect x="90" y="295" width="220" height="5" rx="3" fill="url(#neon)" filter="url(#glow)">
    <animate attributeName="width" values="220;320;220" dur="4s" repeatCount="indefinite"/>
  </rect>

  <text x="90" y="345" font-family="ui-sans-serif, system-ui, sans-serif" font-size="22" fill="#94a3b8">
    polyglot builder · interpreter gremlin · ships weird things
  </text>
</svg>
